name: LanTURN CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node-version }} (${{ matrix.native }})
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        native: ['with C++ core', 'JS only']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node-version }}', cache: npm }
      - run: npm ci
      - name: Build React SPA (experimental frontend)
        working-directory: ./frontend
        run: npm ci && npm run build
      - name: Build C++ core
        if: matrix.native == 'with C++ core'
        run: npm run build:native
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log
        env:
          DISABLE_NATIVE: ${{ matrix.native == 'JS only' && '1' || '' }}
      # Same reason as the browser job: the Actions log archive is not reachable from every environment, check-run
      # annotations are. A failing matrix cell should name the test, not just the node version.
      - name: Report failures as annotations
        if: failure()
        run: node scripts/ci-annotate.mjs unit.log
      - name: Verify demo seeder
        run: npm run seed

  e2e:
    runs-on: ubuntu-latest
    name: Browser tests (Playwright)
    permissions:
      contents: write # only for the optional screenshot publish step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
      # Annotations go through api.github.com and are readable from any environment; the Actions log archive is not.
      - name: Report failures as annotations
        if: failure()
        run: node scripts/ci-annotate.mjs e2e.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-log, path: e2e.log, retention-days: 5 }
      # Design review: every screen, both themes, one PNG each. Off unless the repo carries a `.ui-shots` marker file
      # (create one and push to turn it on; delete it to turn it off), because the browser suite already covers
      # behaviour - this is for looking at the thing.
      # The artifact archive host is not reachable from every environment that needs to look at these, so while the
      # marker file exists the job publishes them to the PR branch instead. Pushes made with GITHUB_TOKEN do not start
      # another run, so this cannot loop.
      - name: Capture screenshots
        if: hashFiles('.ui-shots') != '' && github.event_name == 'pull_request'
        run: |
          set -o pipefail
          # The default checkout is the PR's merge commit; commit the images on top of the branch head instead, so the
          # push is a fast-forward.
          git fetch -q origin ${{ github.event.pull_request.head.ref }} 2>&1 | tee shots.log
          git checkout -q FETCH_HEAD
          node scripts/screenshots.mjs ui-shots 2>&1 | tee -a shots.log
          git config user.name "lanturn-shots"
          git config user.email "actions@users.noreply.github.com"
          git add -A ui-shots
          git commit -q -m "chore(shots): design review screenshots for ${{ github.event.pull_request.head.sha }} [skip ci]" 2>&1 | tee -a shots.log || exit 0
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }} 2>&1 | tee -a shots.log
      - name: Report screenshot problems as annotations
        if: failure() && hashFiles('.ui-shots') != ''
        run: node scripts/ci-annotate.mjs shots.log

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/nlp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/nlp/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  load-smoke:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:native
      - name: Load test (fails if any endpoint errors)
        run: BENCH_JSON=bench.json node scripts/bench.mjs 1500 200 3 16
      - name: Fail on errors
        run: node -e "const r=require('./bench.json');const bad=r.filter(x=>x.errors>0);if(bad.length){console.error(bad);process.exit(1)}"
      - uses: actions/upload-artifact@v4
        with: { name: bench, path: bench.json }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lanturn .
      - run: docker build -t lanturn-nlp services/nlp
