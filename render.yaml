# Render Blueprint: New > Blueprint > pick this repo.
# A persistent disk needs a paid instance ("starter"); on the free plan data is wiped on every deploy.
services:
  - type: web
    name: lanturn
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node --no-warnings server.js
    healthCheckPath: /api/health
    disk:
      name: lanturn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/lanturn.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@yourdomain.com
      - key: ADMIN_PASSWORD
        sync: false   # you will be asked for this in the Render dashboard
      # AI keys are optional here: you can also paste them later in the site (Admin > AI providers).
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
